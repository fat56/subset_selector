experiment:
  id: 0001_stage1_register_quality_gate
  title: Stage 1 register distance versus 3DGS quality gate
  stage: stage1
  status: planned

question: Does register/readout cosine similarity correlate with 20% sparse-view FastGS quality strongly enough to justify selector training?

datasets:
  registry: data/datasets.yaml
  split_policy: scene_level_no_cross_scene_leakage
  scenes: TBD

teacher:
  integration: configs/integrations/vggt_omega.yaml
  output_cache_root: caches/vggt_omega/0001_stage1_register_quality_gate
  backbone: frozen_vggt_omega
  readout_head: register_readout_head_v0
  full_set_policy:
    max_frames: 300
    sampling: dense_uniform_if_needed

selection_methods:
  - random_ratio
  - uniform_stride_ratio
  - feature_k_center
  - register_k_center

budgets:
  fixed_k: []
  ratios: [0.20]
  count_policy: ceil_ratio_at_least_one

evaluation:
  reconstruction_backend: fastgs
  backend_config: configs/integrations/fastgs.yaml
  fastgs:
    eval_split: true
    resolution: null
    data_device: null
    extra_args: []
  metrics:
    - register_cosine_similarity
    - psnr
    - ssim
    - lpips
    - pose_ate
    - pose_rpe
    - subset_ratio

gate:
  statistic: spearman_rho
  pass_threshold: 0.5
  required_direction: positive
