integration:
  id: vggt_omega_local
  type: sibling_repo
  root: external/vggt-omega
  python: external/vggt-omega/.venv/bin/python
  import_mode: subprocess_with_pythonpath

checkpoints:
  default_512:
    path: external/vggt-omega/checkpoints/vggt_omega_1b_512.pt
    image_resolution: 512
    enable_alignment: false
  text_256:
    path: external/vggt-omega/checkpoints/vggt_omega_1b_256_text.pt
    image_resolution: 256
    enable_alignment: true

outputs:
  always:
    - camera_and_register_tokens
    - camera_tokens
    - register_tokens
  optional:
    - pose_enc
    - depth
    - depth_conf
    - text_alignment_embedding
    - text_alignment_token

cache:
  root: caches/vggt_omega
  manifest_name: manifest.json
  tensor_format: torch_pt

