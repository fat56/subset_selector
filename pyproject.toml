[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vggt-omega-selector"
version = "0.1.0"
description = "Experiment framework for VGGT-OMEGA register-token subset selection research."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vggt-selector = "vggt_omega_selector.cli.manage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
